  <text x="82" y="182" text-anchor="middle" font-family="'Inter Tight Variable','Segoe UI',sans-serif" font-size="34" font-weight="700" letter-spacing="-1.6" fill="#fff">monto</text>
  <text x="82" y="204" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#E4DCFF">tus finanzas, en orden</text>

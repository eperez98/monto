[package]
name = "monto"
version = "1.0.4"
description = "Monto — finanzas personales y familiares"
authors = ["Erick Arturo Pérez Cazorla"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "monto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "proxy-from-env"] }
sha2 = "0.10"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows = { version = "0.62", features = ["Data_Pdf", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Security_Credentials_UI", "Storage_Streams", "Win32_System_WinRT"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

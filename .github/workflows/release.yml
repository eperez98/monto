name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (por ejemplo v0.7.1-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publicar versión estable
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verificar que el tag coincide con package.json
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) { throw "El tag $env:TAG no coincide con la versión v$v de package.json" }
      - name: Compilar instaladores
        run: npx tauri build
      - name: Prueba de instalación
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/windows-smoke-test.ps1 -Installer $installer.FullName
      - name: Preparar el paquete (zip con el instalador)
        id: pkg
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          $pkg = "release/Monto_${v}_x64"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/Monto_${v}_x64-setup.exe" $pkg/ -ErrorAction Stop
          Copy-Item packaging/LEEME.txt $pkg/
          Get-ChildItem $pkg -Filter *.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii "$pkg/SHA256SUMS.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"
          node scripts/release-notes.mjs $env:TAG > release/NOTAS.md
          # Release title = first line of the notes (includes the codename from CHANGELOG, if any).
          "title=$((Get-Content release/NOTAS.md -TotalCount 1).TrimStart('# '))" >> $env:GITHUB_OUTPUT
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ steps.pkg.outputs.title }}
          body_path: release/NOTAS.md
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          files: release/*.zip
